services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: vexcash_sms
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vexcash_sms"]
      interval: 3s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data
  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=vexcash_sms;Username=postgres;Password=postgres
      MessageBird__UseMock: "true"
    ports:
      - "8080:8080"
volumes:
  postgres-data:
